
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Status | NK Health Clinic</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(120deg, #075e66, #0b8990);
            color: white;
            padding: 24px 6%;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            color: #d7f5f3;
            font-size: 14px;
        }

        nav {
            background: white;
            padding: 14px 6%;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e2e8f0;
        }

        nav a {
            color: #087f8c;
            text-decoration: none;
            font-weight: 600;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 760px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .status-card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 28px #183b5610;
        }

        .status-card h2 {
            font-size: 27px;
            color: #153447;
            margin-bottom: 8px;
        }

        .description {
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font: inherit;
            margin-bottom: 16px;
        }

        input:focus {
            outline: 2px solid #a5e4e4;
            border-color: #087f8c;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #087f8c;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #075e66;
        }

        #result {
            margin-top: 24px;
        }

        .notice {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 9px;
            color: #475569;
            font-size: 14px;
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 25px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            .status-card {
                padding: 22px;
            }

            .status-card h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>NK Health Clinic</h1>
        <p>Patient Appointment Portal</p>
    </header>

    <nav>
        <a href="index.html">Home & Booking</a>
        <a href="appointment-status.html">Appointment Status</a>
    </nav>

    <main>
        <section class="status-card">
            <h2>Check Your Appointment</h2>

            <p class="description">
                Enter your appointment number to check the latest status.
            </p>

            <form id="statusForm">
                <label for="appointmentNumber">
                    Appointment Number
                </label>

                <input
                    type="text"
                    id="appointmentNumber"
                    placeholder="Example: APT-0003"
                    required
                >

                <button type="submit">Check Status</button>
            </form>

            <div id="result" aria-live="polite"></div>
        </section>
    </main>

<script>
    const statusForm = document.getElementById("statusForm");
    const result = document.getElementById("result");

    statusForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const appointmentNumber = document
            .getElementById("appointmentNumber")
            .value.trim().toLowerCase();

        const appointments = JSON.parse(
            localStorage.getItem("appointments") || "[]"
        );

        const appointment = appointments.find(function(item) {
            return (item.appointmentNumber || "").toLowerCase()
                === appointmentNumber;
        });

        if (!appointment) {
            result.innerHTML = `
                <div class="notice">
                    Appointment not found. Please check your appointment
                    number and try again.
                </div>
            `;
            return;
        }

        const status = appointment.status || "Pending";

        const colours = {
            Pending: "#b7791f",
            Confirmed: "#15803d",
            Completed: "#1d4ed8",
            Cancelled: "#b91c1c"
        };

        result.innerHTML = `
            <div class="notice" style="border-left: 5px solid ${colours[status] || "#64748b"};">
                <h3>Appointment Details</h3>
                <p><strong>Patient:</strong> ${escapeHTML(appointment.patientName || "N/A")}</p>
                <p><strong>Appointment No:</strong> ${escapeHTML(appointment.appointmentNumber || "N/A")}</p>
                <p><strong>Doctor:</strong> ${escapeHTML(appointment.doctorName || appointment.doctor || "N/A")}</p>
                <p><strong>Date:</strong> ${escapeHTML(appointment.appointmentDate || "N/A")}</p>
                <p><strong>Time:</strong> ${escapeHTML(appointment.appointmentTime || "N/A")}</p>
                <p style="margin-top: 10px; color: ${colours[status] || "#64748b"};">
                    <strong>Status: ${escapeHTML(status)}</strong>
                </p>
            </div>
        `;
    });

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];
        });
    }
</script>

    <footer>
        © 2026 NK Health Clinic. All rights reserved.
    </footer>
</body>
</html>
