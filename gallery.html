<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | NK Health Clinic</title>
  <style>
    :root { --ink:#16324f; --muted:#587087; --accent:#16877a; --paper:#f3f8f7; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink);
           font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .navbar { display:flex; justify-content:space-between; align-items:center;
              padding:20px 34px; background:#fff; box-shadow:0 2px 12px #16324f14; }
    .navbar a { text-decoration:none; color:var(--accent); font-weight:700; }
    .navbar strong { color:var(--ink); font-size:18px; }
    main { max-width:1200px; margin:0 auto; padding:34px 24px 50px; }
    h1 { margin:0 0 6px; font-size:clamp(28px,4vw,40px); }
    .sub { color:var(--muted); margin:0 0 26px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
    .grid a { display:block; overflow:hidden; border-radius:12px; background:#dcefeb;
              box-shadow:0 6px 18px #16324f14; }
    .grid img { display:block; width:100%; height:220px; object-fit:cover; transition:transform .3s ease; }
    .grid a:hover img { transform:scale(1.06); }
    .empty { color:var(--muted); }

    .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9);
                z-index:1000; justify-content:center; align-items:center; }
    .lightbox img { max-width:85%; max-height:85%; object-fit:contain; }
    .lightbox .close { position:absolute; top:20px; right:35px; color:#fff; font-size:40px; cursor:pointer; }
    footer { padding:16px 34px; background:#e3eeec; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <strong>NK Health Clinic</strong>
    <a href="index.html">&larr; Back to Home</a>
  </nav>

  <main>
    <h1>Our Clinic Gallery</h1>
    <p class="sub">Click any photo to view it larger.</p>
    <div class="grid" id="galleryGrid"></div>
    <p class="empty" id="emptyMsg" hidden>No photos added yet.</p>
  </main>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close">&times;</span>
    <img id="lightbox-image" src="" alt="Enlarged image">
  </div>

  <footer>Fictional sample page — for practice only.</footer>

  <script>
    const photos = [
      "images/Clinic.jpg",
      "images/Doctor1.jpg",
      "images/Doctor2.jpg",
      "images/123.jpg" ,
      "images/doctor3.jpg",
      "images/doctor4.jpg",
      "images/doctor5.jpg",
      // , "images/Waiting-room.jpg"
      // , "images/Reception.jpg"
    ];

    const grid = document.getElementById("galleryGrid");

    photos.forEach(function (src, i) {
      const link = document.createElement("a");
      link.href = src;
      link.addEventListener("click", function (e) { e.preventDefault(); openLightbox(src); });

      const img = document.createElement("img");
      img.src = src;
      img.alt = "Clinic photo " + (i + 1);
      img.loading = "lazy";
      img.addEventListener("error", function () { link.remove(); showEmptyIfNeeded(); }); // hide broken names

      link.appendChild(img);
      grid.appendChild(link);
    });

    function showEmptyIfNeeded() {
      document.getElementById("emptyMsg").hidden = grid.children.length > 0;
    }

    function openLightbox(src) {
      document.getElementById("lightbox-image").src = src;
      document.getElementById("lightbox").style.display = "flex";
    }
    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLightbox(); });
  </script>
</body>
</html>
